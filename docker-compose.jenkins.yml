services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: taskmanager-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    group_add:
      - "999"
    mem_limit: 1g
    depends_on:
      jenkins-mysql:
        condition: service_healthy

  jenkins-mysql:
    image: mysql:8.0
    container_name: jenkins-mysql
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: taskdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  jenkins-data: